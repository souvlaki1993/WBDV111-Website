<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPG41eoQTPtps9zg20HckuIn31gM1s7Lc",
    authDomain: "babiesproductstradingdb.firebaseapp.com",
    projectId: "babiesproductstradingdb",
    storageBucket: "babiesproductstradingdb.appspot.com",
    messagingSenderId: "250975614380",
    appId: "1:250975614380:web:13cad4dfa9c78111257609"
  };

  // INIT
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // LOGIN
  window.login = function () {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if (user === "admin" && pass === "1234") {
      document.getElementById("login-page").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      loadProducts();
    } else {
      alert("Invalid credentials");
    }
  };

  // LOGOUT
  window.logout = function () {
    document.getElementById("admin-panel").style.display = "none";
    document.getElementById("login-page").style.display = "block";
  };

  // ADD PRODUCT
  window.submitProduct = async function () {
    const name = document.getElementById("name").value;
    const price = document.getElementById("price").value;

    if (!name || !price) {
      alert("Fill all fields");
      return;
    }

    await addDoc(collection(db, "products"), {
      name,
      price: Number(price)
    });

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";

    loadProducts();
  };

  // LOAD PRODUCTS
  async function loadProducts() {
    const querySnapshot = await getDocs(collection(db, "products"));
    const container = document.getElementById("product-list");
    container.innerHTML = "";

    querySnapshot.forEach((doc) => {
      const data = doc.data();

      container.innerHTML += `
        <div class="product">
          <strong>${data.name}</strong><br>
          ₱${data.price}
        </div>
      `;
    });
  }
</script>
